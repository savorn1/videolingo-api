spring.application.name=videolingo
server.port=${SERVER_PORT:8080}

# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:videolingo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate
# only checks that the entities match it at startup.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Flyway. A database created by the old ddl-auto=update has no history table:
# it's baselined at version 0, and the idempotent V1 then fills in whatever
# it's missing. Add schema changes as V2__…sql, V3__…sql — never edit V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT — must be Base64-encoded. No default: an unset JWT_SECRET must fail startup
# rather than silently fall back to a value that's sitting in git history.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Refresh token lifetime (7 days), stored server-side in refresh_tokens so it can be revoked
jwt.refresh-expiration=604800000

# Default admin seeded at startup if it doesn't already exist — change this password
# before deploying anywhere real.
seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}

# Monitoring — health check is public (/actuator/health); metrics and other
# actuator endpoints require ADMIN (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Object storage (S3-compatible — MinIO locally) backing the generic
# /api/files/upload endpoint (see S3Config / S3FileStorageService).
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
s3.bucket=${S3_BUCKET:}
# Overridden to point at MinIO (or any non-AWS S3-compatible endpoint); left
# blank to talk to real AWS S3.
s3.endpoint=${S3_ENDPOINT:}
# Used to build the URL handed back to callers — separate from s3.endpoint
# because the app may reach MinIO over a Docker-internal host while browsers
# need a publicly routable one.
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${s3.endpoint}}
# Links to stored files (videos, thumbnails, edit results, voice-overs) are
# handed to browsers signed, expiring after this many minutes (a signed link is
# reused for a third of that, so any link handed out lasts at least two thirds
# of it). With signing on, the bucket can — and should — be private. Turn off
# only if the bucket is public and plain addresses are wanted.
media.signed-urls=${MEDIA_SIGNED_URLS:true}
media.url-ttl-minutes=${MEDIA_URL_TTL_MINUTES:180}

# Password reset — the emailed link points at the frontend's /reset-password
# page, which posts the token back to /api/auth/reset-password.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}

# Outgoing mail (SMTP). Leave MAIL_HOST blank to skip sending and log the
# reset link to the console instead — handy for local development. For a
# local test inbox, run Mailpit (MAIL_HOST=localhost, MAIL_PORT=1025).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:VideoLingo <no-reply@videolingo.local>}

# ── AI (Claude API) ─────────────────────────────────────────────────────────
# Leave ANTHROPIC_API_KEY blank to switch AI features off (the endpoints then
# answer 503 "AI isn't configured"). ANTHROPIC_BASE_URL is only for pointing
# at a proxy or a local stub; leave it blank for the real API.
ai.api-key=${ANTHROPIC_API_KEY:}
ai.base-url=${ANTHROPIC_BASE_URL:}
ai.model=${AI_MODEL:claude-opus-5}
# Retried once on this model if the main one declines (stop_reason "refusal").
# Blank disables the retry.
ai.fallback-model=${AI_FALLBACK_MODEL:claude-opus-4-8}
ai.generation-effort=${AI_GENERATION_EFFORT:high}
ai.chat-effort=${AI_CHAT_EFFORT:medium}
# Transcripts longer than this are refused rather than truncated (~4 chars/token).
ai.max-transcript-chars=2000000
ai.max-chat-message-chars=4000
# Optional monthly spend cap in USD. When enforced, AI requests are refused
# once this calendar month's recorded cost reaches it.
ai.monthly-budget-usd=${AI_MONTHLY_BUDGET_USD:}
ai.budget-enforced=${AI_BUDGET_ENFORCED:false}
# USD per million tokens (Claude API list prices). Cache writes (5-minute TTL)
# bill at 1.25x input, cache reads at 0.1x input. Update when prices change;
# a model missing here is still tracked, with cost left blank.
ai.cache-write-multiplier=1.25
ai.cache-read-multiplier=0.1
ai.pricing[claude-opus-5].input-per-mtok=5.00
ai.pricing[claude-opus-5].output-per-mtok=25.00
ai.pricing[claude-opus-4-8].input-per-mtok=5.00
ai.pricing[claude-opus-4-8].output-per-mtok=25.00
ai.pricing[claude-sonnet-5].input-per-mtok=2.00
ai.pricing[claude-sonnet-5].output-per-mtok=10.00
ai.pricing[claude-haiku-4-5].input-per-mtok=1.00
ai.pricing[claude-haiku-4-5].output-per-mtok=5.00

# ── Processing pipeline (transcribe / translate / voice-over jobs) ──────────
# The worker runs queued TRANSCRIBE, TRANSLATE and DUB jobs one at a time.
pipeline.enabled=${PIPELINE_ENABLED:true}
pipeline.poll-ms=${PIPELINE_POLL_MS:5000}
# How many jobs of each lane run at once (1 to 4). Jobs in a lane start in order. ffmpeg edits and joins use a lot of CPU and
# memory, so raise the media lane only on a machine that can take it.
pipeline.media-concurrency=${PIPELINE_MEDIA_CONCURRENCY:1}
pipeline.ai-concurrency=${PIPELINE_AI_CONCURRENCY:1}
# yt-dlp downloads audio from YouTube/Vimeo/Facebook links; ffmpeg converts it.
pipeline.yt-dlp-path=${YT_DLP_PATH:yt-dlp}
pipeline.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
pipeline.work-dir=${PIPELINE_WORK_DIR:}
pipeline.max-media-minutes=${PIPELINE_MAX_MEDIA_MINUTES:180}
# Speech-to-text: OpenAI Whisper.
pipeline.openai-api-key=${OPENAI_API_KEY:}
pipeline.openai-base-url=${OPENAI_BASE_URL:}
pipeline.whisper-model=${WHISPER_MODEL:whisper-1}
# Translation: OpenAI chat model (uses the same OPENAI_API_KEY).
pipeline.translation-model=${OPENAI_TRANSLATION_MODEL:gpt-4.1}
# Text-to-speech: OpenAI speech API (uses the same OPENAI_API_KEY).
pipeline.tts-model=${OPENAI_TTS_MODEL:tts-1}
